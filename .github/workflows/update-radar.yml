name: Update Radar BOE

on:
  workflow_dispatch:
  schedule:
    - cron: "5 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Refresh latest BOE data
        run: python scripts/update_latest.py
      - name: Refresh sector pages
        run: python scripts/generate_sector_pages.py
      - name: Commit changed output
        run: |
          git config user.name "radar-boe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.html data/latest.json sitemap.xml sectores
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update latest BOE radar"
            git push
          fi
      - name: Notify IndexNow
        run: python scripts/notify_indexnow.py
