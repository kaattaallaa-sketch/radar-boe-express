name: Update Radar BOE

on:
  workflow_dispatch:
  schedule:
    - cron: "5 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Refresh latest BOE data
        run: python scripts/update_latest.py
      - name: Notify IndexNow
        run: >-
          curl --fail --silent --show-error --output /dev/null
          "https://api.indexnow.org/indexnow?url=https%3A%2F%2Fkaattaallaa-sketch.github.io%2Fradar-boe-express%2Flatest.html&key=a20f9fcd4c64468dac510447ca05affb&keyLocation=https%3A%2F%2Fkaattaallaa-sketch.github.io%2Fradar-boe-express%2Fa20f9fcd4c64468dac510447ca05affb.txt"
      - name: Commit changed output
        run: |
          git config user.name "radar-boe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.html data/latest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update latest BOE radar"
            git push
          fi
